name: Deploy Blog Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # wrangler and miniflare both declare engines.node >=22.0.0, and wrangler
          # refuses to run on anything lower. Node 20 is also deprecated on the runners.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build and Typecheck
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must track the wrangler devDependency in package.json. Left unset the
          # action installs its own default wrangler, whose workers-types peer
          # range contradicts ours and aborts the deploy with ERESOLVE.
          wranglerVersion: "4.125.0"
          command: deploy
